name: CI

# PR gate: build and test on ubuntu + windows.
# SDK comes from global.json; the 8.0 runtime is needed for the net8.0 targets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: b2xtranslator.sln

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (SDK from global.json + net8.0 runtime)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # PRs: build only UnitTests' dependency graph (net10.0); net8.0 is untested here.
      # UnitTests cannot multi-target net8.0 (Shell projects are net10.0 only).
      - name: Build (PR: net10.0 only)
        if: github.event_name == 'pull_request'
        run: dotnet build UnitTests -c Release --no-restore -f net10.0

      # main / manual: build every TFM so net8.0 stays verified.
      - name: Build (all target frameworks)
        if: github.event_name != 'pull_request'
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test UnitTests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
