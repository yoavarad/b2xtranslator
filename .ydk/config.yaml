project:
  name: b2xtranslator
  spec_location: docs/specs
  adrs_location: docs/adrs
  research_location: docs/research
  remote: github
  stack: dotnet
hooks:
  pre_push:
    spec_check: false
    task_check: false
spec_check:
  timeout: 60
  global_timeout: 120
  concurrency: 10
  results_path: .ydk/spec-check-results.json
  thresholds:
    completeness: 8
    clarity: 8
    architecture: 8
  custom: []
task_management:
  dag_validation: true
  coverage_check: true
execution:
  max_parallel_agents: 5
  task_timeout_minutes: 30
  worktree_isolation: true
verification:
  enabled:
  - dotnet-build
  - dotnet-format
  - dotnet-test
  - dotnet-quality
  - dotnet-tdd-guard
